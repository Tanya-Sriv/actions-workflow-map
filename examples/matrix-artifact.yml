name: Matrix Artifact Demo
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/
  test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
      - run: pytest
  deploy:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    environment: staging
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo deploy
