name: Risky
on: workflow_dispatch
permissions: write-all
jobs:
  producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v4
        with: {name: package, path: dist/}
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: package}
      - uses: vendor/action@main
