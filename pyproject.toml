[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actions-workflow-map"
version = "0.2.0"
description = "Visualize GitHub Actions triggers, jobs, dependencies, matrices, permissions, artifacts, and workflow risks."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Tanya Srivastava"}]
dependencies = [
  "typer>=0.12,<1",
  "ruamel.yaml>=0.18,<1",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
actions-workflow-map = "actions_workflow_map.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
